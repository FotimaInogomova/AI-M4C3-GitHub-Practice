<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Example check</title></head><body><h1>Example check</h1><p id="result">Checking...</p><div hidden><span id="tenure"></span><span id="contract"></span><span id="charge"></span><span id="tree"></span><span id="votes"></span><span id="forest"></span></div><script src="model.js"></script><script src="app.js"></script><script>
